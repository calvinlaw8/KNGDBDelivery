---
# ============================================================
# mongodb/04_verify.yml  —  MongoDB 副本集验证
# ============================================================
# 目的：使用认证连接验证 rs.status().ok=1、成员角色、数据写入复制
# ============================================================

- name: MongoDB 节点服务验证
  hosts: mongodb
  gather_facts: false
  tags: mongodb, mongodb-verify

  tasks:
    - name: 检查 mongod 服务状态
      ansible.builtin.command: systemctl is-active mongod
      register: mongod_active
      changed_when: false
      failed_when: mongod_active.stdout != "active"
      become: true

    - name: 显示节点服务状态
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: mongod = {{ mongod_active.stdout }}"


- name: MongoDB 副本集状态验证（Primary 节点执行）
  hosts: mongodb
  gather_facts: false
  tags: mongodb, mongodb-verify

  tasks:
    - name: 验证 rs.status().ok = 1
      ansible.builtin.command:
        cmd: >
          mongosh admin --port {{ mongodb_port }} --quiet --norc
          -u {{ mongodb_admin_user }}
          -p {{ mongodb_admin_password }}
          --eval "rs.status().ok"
      register: rs_ok
      changed_when: false
      failed_when: rs_ok.stdout | trim != '1'
      become: false
      when: inventory_hostname == mongodb_primary_ip
      run_once: true

    - name: 获取副本集成员状态
      ansible.builtin.command:
        cmd: >
          mongosh admin --port {{ mongodb_port }} --quiet --norc
          -u {{ mongodb_admin_user }}
          -p {{ mongodb_admin_password }}
          --eval "
            rs.status().members.forEach(function(m){
              print(m.name + ' -> ' + m.stateStr)
            })
          "
      register: rs_members
      changed_when: false
      become: false
      when: inventory_hostname == mongodb_primary_ip
      run_once: true

    - name: 输出各成员角色
      ansible.builtin.debug:
        msg: "{{ rs_members.stdout_lines }}"
      when: inventory_hostname == mongodb_primary_ip
      run_once: true

    - name: 验证 PRIMARY 角色存在
      ansible.builtin.assert:
        that:
          - rs_members.stdout is search("PRIMARY")
        fail_msg: "副本集中未发现 PRIMARY 角色，请检查集群状态"
        success_msg: "副本集存在 PRIMARY 节点 ✅"
      when: inventory_hostname == mongodb_primary_ip
      run_once: true

    - name: 验证 SECONDARY 数量（应 >= 2）
      ansible.builtin.command:
        cmd: >
          mongosh admin --port {{ mongodb_port }} --quiet --norc
          -u {{ mongodb_admin_user }}
          -p {{ mongodb_admin_password }}
          --eval "
            rs.status().members.filter(function(m){
              return m.stateStr == 'SECONDARY'
            }).length
          "
      register: secondary_count
      changed_when: false
      failed_when: secondary_count.stdout | trim | int < 2
      become: false
      when: inventory_hostname == mongodb_primary_ip
      run_once: true

    - name: 验证通过摘要
      ansible.builtin.debug:
        msg: >-
          MongoDB 副本集验证通过 ✅
          rs.status().ok = {{ rs_ok.stdout | trim }}
          SECONDARY 数量: {{ secondary_count.stdout | trim }}
          副本集: {{ mongodb_replicaset }}
          Primary: {{ mongodb_primary_ip }}:{{ mongodb_port }}
      when: inventory_hostname == mongodb_primary_ip
      run_once: true
