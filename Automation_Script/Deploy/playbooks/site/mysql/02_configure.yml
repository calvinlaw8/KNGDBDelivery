---
# ============================================================
# mysql/02_configure.yml  —  MySQL 配置（my.cnf + 初始化）
# ============================================================
# 目的：
#   1. 根据 IP 查找当前节点的 server_id（from mysql_nodes 列表）
#   2. 写入 my.cnf（GTID 配置，per-node server_id 和 report_host）
#   3. 使用 Debian 包提供的 mysql.service（systemd）
#   4. 执行 mysqld --initialize（serial:1，每节点独立）
#   5. 捕获临时密码并修改 root 密码
#   6. 启动 mysqld 服务
# ============================================================

- name: MySQL 配置 - my.cnf + mysql.service
  hosts: mysql
  gather_facts: false
  tags: mysql, mysql-configure

  tasks:
    - name: 查询当前节点 server_id
      ansible.builtin.set_fact:
        my_server_id: >-
          {{
            (mysql_nodes
             | selectattr('ip', 'equalto', inventory_hostname)
             | list
             | first).server_id
          }}

    - name: 允许 AppArmor 访问自定义 MySQL 数据目录
      ansible.builtin.blockinfile:
        path: /etc/apparmor.d/local/usr.sbin.mysqld
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} Ansible MySQL data directory"
        block: |
          capability chown,
          capability dac_read_search,
          {{ mysql_data_dir }}/ rw,
          {{ mysql_data_dir }}/** rwk,
      become: true

    - name: 重新加载 MySQL AppArmor profile
      ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.sbin.mysqld
      changed_when: true
      become: true

    - name: 创建 /etc/mysql 配置目录
      ansible.builtin.file:
        path: /etc/mysql
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: 创建 MySQL 数据和日志目录
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: mysql
        group: mysql
        mode: "0750"
      loop:
        - { path: "{{ mysql_data_dir }}" }
        - { path: "{{ mysql_log_dir }}" }
      become: true

    - name: 兼容 libaio.so.1（Ubuntu 24.04 改名为 libaio1t64）
      ansible.builtin.file:
        src: /usr/lib/x86_64-linux-gnu/libaio.so.1t64
        dest: /usr/lib/x86_64-linux-gnu/libaio.so.1
        state: link
      become: true
      when: ansible_facts is not defined or true   # 始终执行（幂等）

    - name: 写入 my.cnf（GTID 主从配置）
      ansible.builtin.copy:
        dest: "{{ mysql_config_file }}"
        content: |
          [mysqld]
          # 基础配置
          basedir          = {{ mysql_base_dir }}
          lc-messages-dir  = /usr/share/mysql-8.4
          datadir          = {{ mysql_data_dir }}
          socket           = {{ mysql_socket }}
          pid-file         = {{ mysql_data_dir }}/mysqld.pid
          port             = {{ mysql_port }}

          # 字符集
          character-set-server = utf8mb4
          collation-server     = utf8mb4_unicode_ci

          # 节点标识
          server-id        = {{ my_server_id }}
          report_host      = {{ inventory_hostname }}

          # GTID 配置
          gtid_mode            = ON
          enforce_gtid_consistency = ON
          log_bin              = {{ mysql_log_dir }}/mysql-bin
          binlog_format        = ROW
          log_slave_updates    = ON
          relay-log            = {{ mysql_log_dir }}/relay-bin

          # 复制安全
          read_only            = ON
          super_read_only      = OFF

          # InnoDB
          innodb_buffer_pool_size = 512M
          innodb_log_file_size    = 128M

          # 错误日志
          log-error            = {{ mysql_log_dir }}/mysqld.err

          [client]
          socket = {{ mysql_socket }}
        owner: root
        group: root
        mode: "0644"
      become: true

- name: MySQL 配置 - 初始化数据目录（serial=1，避免并发）
  hosts: mysql
  gather_facts: false
  serial: 1
  tags: mysql, mysql-initialize

  tasks:
    - name: 检查数据目录是否已初始化（mysql 系统库存在性判断）
      ansible.builtin.stat:
        path: "{{ mysql_data_dir }}/mysql"
      register: mysql_db_dir

    - name: 初始化 MySQL 数据目录（mysqld --initialize，约 30-60 秒，每 10 秒汇报一次）
      ansible.builtin.file:
        path: "{{ mysql_data_dir }}"
        state: absent
      when: not mysql_db_dir.stat.exists
      become: true

    - name: 清理未初始化节点的残留错误日志
      ansible.builtin.file:
        path: "{{ mysql_log_dir }}/mysqld.err"
        state: absent
      when: not mysql_db_dir.stat.exists
      become: true

    - name: 初始化 MySQL 数据目录（mysqld --initialize，约 30-60 秒，每 10 秒汇报一次）
      ansible.builtin.shell:
        cmd: |
          set -e
          parent_dir="$(dirname '{{ mysql_data_dir }}')"
          parent_owner="$(stat -c '%u:%g' "${parent_dir}")"
          parent_mode="$(stat -c '%a' "${parent_dir}")"
          chown mysql:mysql "${parent_dir}"
          restore_parent_mode() {
            chown "${parent_owner}" "${parent_dir}"
            chmod "${parent_mode}" "${parent_dir}"
          }
          trap restore_parent_mode EXIT
          {{ mysql_server_bin }} \
            --defaults-file={{ mysql_config_file }} \
            --initialize \
            --user=mysql \
            --basedir={{ mysql_base_dir }} \
            --datadir={{ mysql_data_dir }}
      when: not mysql_db_dir.stat.exists
      register: init_result
      async: 300
      poll: 10
      become: true

    - name: 启动 mysqld
      ansible.builtin.systemd:
        name: "{{ mysql_service_name }}"
        state: started
        enabled: true
        daemon_reload: true
      become: true

    - name: 等待 mysqld 启动（监听 3306）
      ansible.builtin.wait_for:
        port: "{{ mysql_port }}"
        host: "{{ inventory_hostname }}"
        timeout: 30
      delegate_to: localhost

    - name: 初始化或验证 MySQL root 认证
      block:
        - name: 写入正式 root 客户端临时配置
          ansible.builtin.copy:
            dest: /run/ecopilot-mysql-root.cnf
            content: |
              [client]
              user=root
              password="{{ mysql_root_password | replace('\\', '\\\\') | replace('"', '\\"') }}"
              protocol=TCP
              host=127.0.0.1
              port={{ mysql_port }}
            owner: root
            group: root
            mode: "0600"
          become: true
          no_log: true

        - name: 检查正式 root 密码是否已生效
          ansible.builtin.command:
            argv:
              - "{{ mysql_client_bin }}"
              - --defaults-extra-file=/run/ecopilot-mysql-root.cnf
              - --batch
              - --skip-column-names
              - -e
              - SELECT 1
          register: configured_root_auth
          changed_when: false
          failed_when: false
          become: true
          no_log: true

        - name: 检查本机 root socket 管理认证
          ansible.builtin.command:
            argv:
              - "{{ mysql_client_bin }}"
              - --no-defaults
              - --protocol=SOCKET
              - "--socket={{ mysql_socket }}"
              - -uroot
              - --batch
              - --skip-column-names
              - -e
              - SELECT 1
          register: local_socket_auth
          changed_when: false
          failed_when: false
          when: configured_root_auth.rc != 0
          become: true
          no_log: true

        - name: 捕获临时 root 密码
          ansible.builtin.shell:
            cmd: >
              awk '/A temporary password is generated for root@localhost: / {
              sub(/^.*: /, ""); print $1
              }' {{ mysql_log_dir }}/mysqld.err | tail -1
          register: temp_password
          changed_when: false
          failed_when: false
          when:
            - configured_root_auth.rc != 0
            - local_socket_auth.rc != 0
          become: true
          no_log: true

        - name: 断言临时 root 密码可用于恢复
          ansible.builtin.assert:
            that:
              - temp_password.rc == 0
              - temp_password.stdout | trim | length > 0
            fail_msg: >-
              MySQL 处于 BROKEN_AUTH：正式 root 密码不可用，且无法从
              {{ mysql_log_dir }}/mysqld.err 提取临时密码；保留现场并停止。
          when:
            - configured_root_auth.rc != 0
            - local_socket_auth.rc != 0

        - name: 写入 root 密码恢复文件
          when: configured_root_auth.rc != 0
          no_log: true
          block:
            - name: 写入临时 root 客户端配置
              ansible.builtin.copy:
                dest: /run/ecopilot-mysql-bootstrap.cnf
                content: |
                  [client]
                  user=root
                  password="{{ temp_password.stdout | trim | replace('\\', '\\\\') | replace('"', '\\"') }}"
                  protocol=TCP
                  host=127.0.0.1
                  port={{ mysql_port }}
                owner: root
                group: root
                mode: "0600"
              become: true
              when: local_socket_auth.rc != 0

            - name: 写入 root 密码变更 SQL
              ansible.builtin.copy:
                dest: /run/ecopilot-mysql-bootstrap.sql
                content: "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '{{ mysql_root_password | replace(\"'\", \"''\") }}';\n"
                owner: root
                group: root
                mode: "0600"
              become: true

        - name: 恢复 root 正式密码
          ansible.builtin.command:
            argv:
              - timeout
              - "30"
              - "{{ mysql_client_bin }}"
              - --no-defaults
              - --protocol=SOCKET
              - "--socket={{ mysql_socket }}"
              - -uroot
              - --batch
              - --skip-column-names
              - -e
              - "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY '{{ mysql_root_password | replace(\"'\", \"''\") }}'"
          register: change_root_password
          changed_when: change_root_password.rc == 0
          failed_when: false
          when:
            - configured_root_auth.rc != 0
            - local_socket_auth.rc == 0
          become: true
          no_log: true

        - name: 使用临时密码恢复 root 正式密码
          ansible.builtin.shell:
            cmd: |
              set -e
              temp_password="$(awk '/A temporary password is generated for root@localhost: / { sub(/^.*: /, ""); print $1 }' {{ mysql_log_dir }}/mysqld.err | tail -1)"
              MYSQL_PWD="${temp_password}" timeout 30 {{ mysql_client_bin }} --no-defaults --protocol=TCP --host=127.0.0.1 --port={{ mysql_port }} --user=root --connect-expired-password --batch --skip-column-names -e "source /run/ecopilot-mysql-bootstrap.sql"
          register: temp_change_root_password
          changed_when: temp_change_root_password.rc == 0
          failed_when: false
          when:
            - configured_root_auth.rc != 0
            - local_socket_auth.rc != 0
          become: true
          no_log: true

        - name: 为未执行的认证恢复分支补齐返回码
          ansible.builtin.set_fact:
            change_root_password: "{{ change_root_password | default({'rc': 1}) }}"
            temp_change_root_password: "{{ temp_change_root_password | default({'rc': 1}) }}"
          when: configured_root_auth.rc != 0

        - name: 计算 root 密码恢复返回码
          ansible.builtin.set_fact:
            root_password_restore_rc: "{{ (change_root_password.rc if local_socket_auth.rc == 0 else temp_change_root_password.rc) | int }}"
          when: configured_root_auth.rc != 0

        - name: 验证恢复后的 root 认证插件
          ansible.builtin.command:
            argv:
              - "{{ mysql_client_bin }}"
              - --defaults-extra-file=/run/ecopilot-mysql-root.cnf
              - --batch
              - --skip-column-names
              - -e
              - SELECT plugin FROM mysql.user WHERE User='root' AND Host='localhost'
          register: recovered_root_plugin
          changed_when: false
          failed_when: false
          when:
            - configured_root_auth.rc != 0
            - local_socket_auth.rc == 0
            - change_root_password.rc == 0
          become: true
          no_log: true

        - name: 断言 socket 恢复已切换为密码插件
          ansible.builtin.assert:
            that:
              - recovered_root_plugin.stdout | trim == 'caching_sha2_password'
            fail_msg: "MySQL socket 恢复未切换为密码认证插件；保留现场并停止。"
          when:
            - configured_root_auth.rc != 0
            - local_socket_auth.rc == 0
            - change_root_password.rc == 0

        - name: 提取脱敏 MySQL 错误编号
          ansible.builtin.set_fact:
            mysql_auth_error_code: >-
              {{ (change_root_password if local_socket_auth.rc == 0 else temp_change_root_password).stderr
                 | default('')
                 | regex_search('ERROR [0-9]+')
                 | default('UNKNOWN', true) }}
          when:
            - configured_root_auth.rc != 0
            - (change_root_password.rc if local_socket_auth.rc == 0 else temp_change_root_password.rc) != 0

        - name: 记录 root 认证状态（脱敏）
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }} root 认证状态：
              {{ 'CONFIGURED（正式密码已生效）' if configured_root_auth.rc == 0
                  else ('RECOVERY_AUTH（本机 socket 恢复成功）'
                  if local_socket_auth.rc == 0 and change_root_password.rc == 0
                  else ('TEMP_AUTH（临时密码恢复成功）' if local_socket_auth.rc != 0 and temp_change_root_password.rc == 0
                  else 'BROKEN_AUTH（root 密码变更失败，错误编号 ' ~ mysql_auth_error_code ~ '）')) }}

        - name: 断言 root 密码恢复成功
          ansible.builtin.assert:
            that:
              - configured_root_auth.rc == 0 or root_password_restore_rc == 0
            fail_msg: >-
              MySQL root 密码变更失败；敏感 stderr 已隐藏，错误编号
              {{ mysql_auth_error_code | default('UNKNOWN') }}。

        - name: 使用正式密码执行最终认证验证
          ansible.builtin.command:
            argv:
              - "{{ mysql_client_bin }}"
              - --defaults-extra-file=/run/ecopilot-mysql-root.cnf
              - --batch
              - --skip-column-names
              - -e
              - SELECT 1
          register: final_root_auth
          changed_when: false
          become: true
          no_log: true

        - name: 断言最终 root 认证成功
          ansible.builtin.assert:
            that:
              - final_root_auth.rc == 0
              - final_root_auth.stdout | trim == '1'
            fail_msg: "MySQL root 正式密码最终认证失败；节点状态为 BROKEN_AUTH。"
      always:
        - name: 清理 MySQL 认证临时文件
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /run/ecopilot-mysql-root.cnf
            - /run/ecopilot-mysql-bootstrap.cnf
            - /run/ecopilot-mysql-bootstrap.sql
          become: true
          no_log: true

    - name: 验证 mysqld 服务状态
      ansible.builtin.command: "systemctl is-active {{ mysql_service_name }}"
      register: mysqld_active
      changed_when: false
      failed_when: mysqld_active.stdout != "active"
      become: true

    - name: 显示节点初始化结果
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: mysqld = {{ mysqld_active.stdout }}, server_id = {{ my_server_id }}"
