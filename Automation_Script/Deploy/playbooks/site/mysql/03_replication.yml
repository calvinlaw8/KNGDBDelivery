---
# ============================================================
# mysql/03_replication.yml  —  MySQL GTID 主从复制配置
# ============================================================
# 目的：
#   1. 在 Primary 上关闭 read_only，创建复制账号 repl
#   2. 在 Replica 上配置 CHANGE REPLICATION SOURCE（GTID 模式）
#   3. 启动复制线程，验证 IO/SQL Running=Yes
# ============================================================

- name: MySQL 复制 - Primary 创建复制账号
  hosts: mysql
  gather_facts: false
  tags: mysql, mysql-replication
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"

  tasks:
    - name: Primary - 关闭 read_only（Primary 无需只读）
      ansible.builtin.shell:
        cmd: >
          {{ mysql_client_bin }}
          --protocol=TCP
          --host=127.0.0.1
          --port={{ mysql_port }}
          -u root
          -e "SET GLOBAL read_only=OFF; SET GLOBAL super_read_only=OFF;"
      changed_when: false
      become: true
      no_log: true
      when: inventory_hostname == mysql_primary_ip
      run_once: true

    - name: 创建仅限集群内 VIP 验证的账户
      when: inventory_hostname == mysql_primary_ip
      run_once: true
      no_log: true
      block:
        - name: 写入临时 VIP 验证账户 SQL
          ansible.builtin.copy:
            dest: /run/ecopilot-mysql-vip-verify.sql
            content: |
              CREATE USER IF NOT EXISTS '{{ mysql_vip_verify_user }}'@'{{ mysql_vip_verify_host }}'
                IDENTIFIED WITH caching_sha2_password
                BY '{{ mysql_vip_verify_password | replace("'", "''") }}';
              ALTER USER '{{ mysql_vip_verify_user }}'@'{{ mysql_vip_verify_host }}'
                IDENTIFIED WITH caching_sha2_password
                BY '{{ mysql_vip_verify_password | replace("'", "''") }}';
              GRANT USAGE ON *.* TO '{{ mysql_vip_verify_user }}'@'{{ mysql_vip_verify_host }}';
              FLUSH PRIVILEGES;
            owner: root
            group: root
            mode: "0600"
          become: true

        - name: 执行临时 VIP 验证账户 SQL
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }} --protocol=TCP --host=127.0.0.1
              --port={{ mysql_port }} -u root
              -e "source /run/ecopilot-mysql-vip-verify.sql"
          changed_when: false
          become: true

      always:
        - name: 删除临时 VIP 验证账户 SQL
          ansible.builtin.file:
            path: /run/ecopilot-mysql-vip-verify.sql
            state: absent
          become: true

    - name: 清理 root 非本地远程管理账号
      become: true
      no_log: true
      block:
        - name: 写入 root 远程账号清理 SQL
          ansible.builtin.copy:
            dest: /run/ecopilot-mysql-root-cleanup.sql
            content: |
              DROP USER IF EXISTS 'root'@'%';
              FLUSH PRIVILEGES;
            owner: root
            group: root
            mode: "0600"

        - name: 执行 root 远程账号清理 SQL
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }}
              --protocol=TCP
              --host=127.0.0.1
              --port={{ mysql_port }}
              -u root
              -e "source /run/ecopilot-mysql-root-cleanup.sql"

      always:
        - name: 删除 root 远程账号清理 SQL
          ansible.builtin.file:
            path: /run/ecopilot-mysql-root-cleanup.sql
            state: absent
          become: true

    - name: 检查 repl 账号是否已存在
      ansible.builtin.shell:
        cmd: >
          {{ mysql_client_bin }}
          --protocol=TCP
          --host=127.0.0.1
          --port={{ mysql_port }}
          -u root
          -e "SELECT COUNT(*) FROM mysql.user WHERE User='{{ mysql_repl_user }}';"
          | tail -1
      register: repl_user_check
      changed_when: false
      become: true
      no_log: true
      when: inventory_hostname == mysql_primary_ip
      run_once: true

    - name: 创建复制账号（若不存在）
      when:
        - inventory_hostname == mysql_primary_ip
        - repl_user_check.stdout | trim | int == 0
      run_once: true
      block:
        - name: 写入临时复制账号 SQL
          ansible.builtin.copy:
            dest: /run/ecopilot-mysql-replication.sql
            content: |
              CREATE USER '{{ mysql_repl_user }}'@'%'
                IDENTIFIED WITH caching_sha2_password
                BY '{{ mysql_repl_password | replace("'", "''") }}';
              GRANT REPLICATION SLAVE ON *.* TO '{{ mysql_repl_user }}'@'%';
              FLUSH PRIVILEGES;
            owner: root
            group: root
            mode: "0600"
          become: true
          no_log: true

        - name: 执行复制账号 SQL
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }}
              --protocol=TCP
              --host=127.0.0.1
              --port={{ mysql_port }}
              -u root
              -e "source /run/ecopilot-mysql-replication.sql"
          become: true
          no_log: true

      always:
        - name: 删除临时复制账号 SQL
          ansible.builtin.file:
            path: /run/ecopilot-mysql-replication.sql
            state: absent
          become: true

    - name: 显示 Primary GTID 已执行集合
      ansible.builtin.shell:
        cmd: >
          {{ mysql_client_bin }}
          --protocol=TCP
          --host=127.0.0.1
          --port={{ mysql_port }}
          -u root
          -NBe "SELECT @@gtid_executed;"
      register: master_status
      changed_when: false
      become: true
      no_log: true
      when: inventory_hostname == mysql_primary_ip
      run_once: true

    - name: 输出 Master 状态
      ansible.builtin.debug:
        msg: "{{ master_status.stdout_lines }}"
      when: inventory_hostname == mysql_primary_ip
      run_once: true


- name: MySQL 复制 - Replica 配置 CHANGE REPLICATION SOURCE
  hosts: mysql
  gather_facts: false
  tags: mysql, mysql-replication
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"

  tasks:
    - name: Replica 节点 - 配置并启动 GTID 复制
      when: inventory_hostname != mysql_primary_ip
      block:
        - name: 读取复制状态
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }}
              --protocol=TCP
              --host=127.0.0.1
              --port={{ mysql_port }}
              -u root
              -e "SHOW REPLICA STATUS\G"
          register: repl_status
          changed_when: false
          failed_when: repl_status.rc != 0
          become: true
          no_log: true

        - name: 配置 CHANGE REPLICATION SOURCE（若未启动）
          when: "'Replica_IO_Running: Yes' not in repl_status.stdout"
          block:
            - name: 写入临时 Replica 配置 SQL
              ansible.builtin.copy:
                dest: /run/ecopilot-mysql-replica-config.sql
                content: |
                  STOP REPLICA;
                  RESET REPLICA ALL;
                  CHANGE REPLICATION SOURCE TO
                    SOURCE_HOST='{{ mysql_primary_ip }}',
                    SOURCE_PORT={{ mysql_port }},
                    SOURCE_USER='{{ mysql_repl_user }}',
                    SOURCE_PASSWORD='{{ mysql_repl_password | replace("'", "''") }}',
                    GET_SOURCE_PUBLIC_KEY=1,
                    SOURCE_AUTO_POSITION=1;
                  START REPLICA;
                owner: root
                group: root
                mode: "0600"
              become: true
              no_log: true

            - name: 执行临时 Replica 配置 SQL
              ansible.builtin.shell:
                cmd: >
                  {{ mysql_client_bin }}
                  --protocol=TCP
                  --host=127.0.0.1
                  --port={{ mysql_port }}
                  -u root
                  -e "source /run/ecopilot-mysql-replica-config.sql"
              become: true
              no_log: true

          always:
            - name: 删除临时 Replica 配置 SQL
              ansible.builtin.file:
                path: /run/ecopilot-mysql-replica-config.sql
                state: absent
              become: true

        - name: 确保 Replica 设为只读
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }}
              --protocol=TCP
              --host=127.0.0.1
              --port={{ mysql_port }}
              -u root
              -e "SET GLOBAL read_only=ON;"
          changed_when: false
          become: true
          no_log: true

        - name: 等待复制同步（10 秒）
          ansible.builtin.wait_for:
            timeout: 10
          delegate_to: localhost

        - name: 验证 IO Thread Running = Yes
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }}
              --protocol=TCP
              --host=127.0.0.1
              --port={{ mysql_port }}
              -u root
              -e "SHOW REPLICA STATUS\G"
          register: io_running
          changed_when: false
          failed_when: "'Replica_IO_Running: Yes' not in io_running.stdout"
          become: true
          no_log: true

        - name: 验证 SQL Thread Running = Yes
          ansible.builtin.shell:
            cmd: >
              {{ mysql_client_bin }}
              --protocol=TCP
              --host=127.0.0.1
              --port={{ mysql_port }}
              -u root
              -e "SHOW REPLICA STATUS\G"
          register: sql_running
          changed_when: false
          failed_when: "'Replica_SQL_Running: Yes' not in sql_running.stdout"
          become: true
          no_log: true

        - name: 显示 Replica 复制状态
          ansible.builtin.debug:
            msg: >-
              {{ inventory_hostname }}: IO/SQL 线程均为 Yes ✅
