---
# ============================================================
# rabbitmq/01_install.yml  —  RabbitMQ 4.2.9 + Erlang 27 离线安装
# ============================================================
# 目的：将 RabbitMQ 4.2.9 与 Erlang 27.3.4.16 离线包分发到 3 台节点并安装
# 离线包路径（Ansible-01）：{{ rabbitmq_pkg_dir }}/*.deb
# ============================================================

- name: RabbitMQ 安装 - 分发离线包并安装
  hosts: rabbitmq
  gather_facts: false
  tags: rabbitmq, rabbitmq-install

  tasks:
    - name: 清理旧 RabbitMQ 离线包暂存目录
      ansible.builtin.file:
        path: /tmp/rabbitmq
        state: absent
      become: true

    - name: 创建目标暂存目录
      ansible.builtin.file:
        path: /tmp/rabbitmq
        state: directory
        mode: "0755"
      become: true

    - name: 请求停止旧 RabbitMQ 服务（重新初始化节点状态）
      ansible.builtin.command: systemctl stop --no-block rabbitmq-server.service
      become: true
      changed_when: false
      failed_when: false

    - name: 等待旧 RabbitMQ 服务停止
      ansible.builtin.command: systemctl is-active rabbitmq-server.service
      register: old_rabbitmq_status
      changed_when: false
      failed_when: false
      until: old_rabbitmq_status.rc != 0
      retries: 30
      delay: 2
      become: true

    - name: 清理旧 RabbitMQ 节点状态
      ansible.builtin.file:
        path: /var/lib/rabbitmq/mnesia
        state: absent
      become: true

    - name: 分发所有 .deb 包
      ansible.builtin.copy:
        src: "{{ rabbitmq_pkg_dir }}/"
        dest: /tmp/rabbitmq/
        owner: root
        mode: "0644"
      become: true

    - name: 验证 .deb 包已上传
      ansible.builtin.shell:
        cmd: find /tmp/rabbitmq -maxdepth 1 -type f -name '*.deb' | wc -l
      register: deb_count
      changed_when: false
      become: true

    - name: 检查包数量非空
      ansible.builtin.assert:
        that: deb_count.stdout | int > 0
        fail_msg: >-
          {{ inventory_hostname }} 暂存目录中 .deb 数量为
          {{ deb_count.stdout }}，请检查上传是否完整。

    - name: 阻止 dpkg 维护脚本在安装期间自动启动 RabbitMQ
      ansible.builtin.copy:
        dest: /usr/sbin/policy-rc.d
        content: "#!/bin/sh\nexit 101\n"
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: 屏蔽 RabbitMQ systemd 服务，避免 postinst 显式重启
      ansible.builtin.command: systemctl mask rabbitmq-server.service
      changed_when: false
      become: true

    - name: 等待 dpkg 前端锁释放
      ansible.builtin.shell:
        cmd: >-
          if command -v fuser >/dev/null 2>&1 &&
             fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
            exit 1
          fi
      register: dpkg_lock_wait
      changed_when: false
      until: dpkg_lock_wait.rc == 0
      retries: 60
      delay: 5
      become: true

    - name: 通过本地包缓存安装 RabbitMQ（不下载、不删除）
      block:
        - name: 执行离线 dpkg 安装
          ansible.builtin.shell:
            cmd: |
              for attempt in $(seq 1 60); do
                if command -v fuser >/dev/null 2>&1 &&
                   fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
                  sleep 5
                  continue
                fi
                dpkg -i /tmp/rabbitmq/*.deb
                rc=$?
                if [ "$rc" -eq 0 ]; then
                  exit 0
                fi
                if [ "$rc" -ne 2 ] ||
                   ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
                  exit "$rc"
                fi
                sleep 5
              done
              exit 2
          register: dpkg_result
          changed_when: "'Setting up rabbitmq-server' in dpkg_result.stdout"
          become: true
      always:
        - name: 解除 RabbitMQ systemd 服务屏蔽
          ansible.builtin.command: systemctl unmask rabbitmq-server.service
          changed_when: false
          become: true

        - name: 删除安装期间的临时启动策略
          ansible.builtin.file:
            path: /usr/sbin/policy-rc.d
            state: absent
          become: true

    - name: 显示 dpkg 安装结果
      ansible.builtin.debug:
        msg: "{{ dpkg_result.stdout_lines | select('match', '^(Setting up|Selecting|Processing)') | list }}"
      when: dpkg_result.stdout_lines is defined

    - name: 写入统一 Erlang Cookie 供 RabbitMQ CLI 使用
      ansible.builtin.copy:
        dest: /var/lib/rabbitmq/.erlang.cookie
        content: "{{ erlang_cookie }}"
        owner: rabbitmq
        group: rabbitmq
        mode: "0400"
      become: true

    - name: 验证 RabbitMQ 版本
      ansible.builtin.command: rabbitmqctl version
      register: rmq_version
      changed_when: false
      become: true

    - name: 显示 RabbitMQ 版本
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: RabbitMQ {{ rmq_version.stdout }}"
