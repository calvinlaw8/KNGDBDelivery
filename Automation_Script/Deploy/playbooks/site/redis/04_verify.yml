---
# ============================================================
# redis/04_verify.yml  —  Redis 集群验证
# ============================================================
# 目的：验证 redis-server、redis-sentinel 服务状态，
#       确认主从复制和 Sentinel 监控正常
# ============================================================

- name: Redis 集群验证
  hosts: redis
  gather_facts: false
  tags: redis, redis-verify
  environment:
    REDISCLI_AUTH: "{{ redis_password }}"

  tasks:
    - name: 检查 redis-server 服务状态
      ansible.builtin.command: systemctl is-active redis-server
      register: redis_active
      changed_when: false
      failed_when: redis_active.stdout != "active"
      become: true

    - name: 检查 redis-sentinel 服务状态
      ansible.builtin.command: systemctl is-active redis-sentinel
      register: sentinel_active
      changed_when: false
      failed_when: sentinel_active.stdout != "active"
      become: true

    - name: 验证主从复制（info replication）
      ansible.builtin.shell:
        cmd: >
          redis-cli -p {{ redis_port }} --no-auth-warning
          info replication | grep -E 'role:|connected_slaves:|master_host:'
      register: replication_info
      changed_when: false
      become: true
      no_log: true

    - name: 显示复制状态
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ replication_info.stdout_lines }}"


- name: Redis Sentinel 监控验证（主节点执行）
  hosts: redis
  gather_facts: false
  tags: redis, redis-verify

  tasks:
    - name: 查看 Sentinel 已监控的 master
      ansible.builtin.shell:
        cmd: >
          redis-cli -p {{ sentinel_port }} sentinel masters |
          grep -E 'name|ip|port|flags|num-slaves|num-other-sentinels'
      register: sentinel_masters
      changed_when: false
      become: true
      no_log: true
      when: inventory_hostname == redis_master_ip

    - name: 显示 Sentinel 监控摘要
      ansible.builtin.debug:
        msg: "{{ sentinel_masters.stdout_lines }}"
      when: inventory_hostname == redis_master_ip

    - name: 确认 Sentinel 监控的从节点数量（应 >= 2）
      ansible.builtin.shell:
        cmd: >
          redis-cli -p {{ sentinel_port }} sentinel slaves {{ sentinel_master_name }} |
          grep -c 'name'
      register: slave_count
      changed_when: false
      failed_when: slave_count.stdout | int < 2
      become: true
      no_log: true
      when: inventory_hostname == redis_master_ip

    - name: 验证通过摘要
      ansible.builtin.debug:
        msg: >-
          Redis 集群验证通过 ✅
          主节点: {{ redis_master_ip }}
          已监控从节点数: {{ slave_count.stdout }}
          redis-server: active, redis-sentinel: active
      when: inventory_hostname == redis_master_ip
