# ============================================================
# group_vars/mysql.yml  —  MySQL GTID 主从 + Keepalived 变量
# ============================================================

mysql_version: "8.4.11"
mysql_port: 3306
mysql_replication_max_delay_seconds: 30

# Debian 包安装路径
mysql_base_dir: "/usr"
mysql_data_dir: "/data/mysql"
mysql_log_dir: "/var/log/mysql"
mysql_config_file: "/etc/mysql/my.cnf"
mysql_socket: "/run/mysqld/mysqld.sock"
mysql_pkg_dir: "/home/sysadmin/pkg/mysql"
mysql_server_package: "mysql-community-server"
mysql_client_bin: "/usr/bin/mysql"
mysql_server_bin: "/usr/sbin/mysqld"
mysql_service_name: "mysql"

# 节点拓扑
mysql_nodes:
  - ip: "CHANGE_ME"
    hostname: "CHANGE_ME"
    server_id: 1
    role: "primary"
    keepalived_priority: 100
  - ip: "CHANGE_ME"
    hostname: "CHANGE_ME"
    server_id: 2
    role: "replica"
    keepalived_priority: 90
  - ip: "CHANGE_ME"
    hostname: "CHANGE_ME"
    server_id: 3
    role: "replica"
    keepalived_priority: 80

# 账号
mysql_root_password: "CHANGE_ME"
mysql_repl_user: "repl"
mysql_repl_password: "CHANGE_ME"
mysql_vip_verify_user: "ecopilot_vip_verify"
# SQL 验证在 Primary 节点经 VIP 执行；由向导写入 Primary 精确 IP。
mysql_vip_verify_host: "CHANGE_ME"
mysql_vip_verify_password: "CHANGE_ME"

# Keepalived VIP 配置
mysql_vip: "CHANGE_ME"
mysql_vip_prefix: 24
# 使用 auto 时由每台 MySQL 节点根据默认路由自动识别实际网卡。
keepalived_interface: "auto"
keepalived_router_id: 61
keepalived_auth_pass: "CHANGE_ME"
# H-104 边界复核只读模式；禁止自动提升或清除 read_only
mysql_failover_authorized: false

