# ============================================================
# group_vars/rabbitmq.yml  —  RabbitMQ 集群变量
# ============================================================

# 种子节点（Cluster 初始化节点，作为其他节点 join 的目标）
rabbitmq_seed_node_ip: "CHANGE_ME"
rabbitmq_seed_hostname: "CHANGE_ME"

rabbitmq_version: "4.2.9"
erlang_version: "1:27.3.4.16-1"

# 节点名称前缀（用于集群状态 grep 匹配）
rabbitmq_node_prefix: "CHANGE_ME"
rabbitmq_cluster_hostnames: []

# 仅首次部署且明确确认无须保留 RabbitMQ 数据时开启；默认禁止破坏性重建
rabbitmq_rebuild_cluster: false

# Erlang Cookie（3 节点必须完全一致）
erlang_cookie: "CHANGE_ME"

# 管理员账号
rabbitmq_admin_user: "admin"
rabbitmq_admin_password: "CHANGE_ME"

# Management Plugin 端口
rabbitmq_management_port: 15672
